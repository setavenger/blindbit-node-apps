# Friglet web interface over HTTPS with the MyNode certificate.
# The container publishes the interface on 127.0.0.1:8097 only; this is the way in from the LAN.
server {
    listen 8098 ssl;
    server_name blindbit-friglet;

    include /etc/nginx/mynode/mynode_ssl_params.conf;
    include /etc/nginx/mynode/mynode_ssl_cert_key.conf;

    access_log /var/log/nginx/access_blindbit-friglet.log;
    error_log /var/log/nginx/error_blindbit-friglet.log;

    # Setup sends a descriptor and a birthday; nothing larger
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8097;

        include /etc/nginx/mynode/mynode_ssl_proxy_params.conf;
    }
}
